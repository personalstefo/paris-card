<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>For you ✦</title>
<style>
  :root{
    --cream:#fff8ee;
    --paper:#fdfcf8;
    --env1:#f7e2c4;
    --env2:#e9c893;
    --env3:#d9ab6b;
    --ink:#3b2f4a;
    --gold:#c9962f;
    --rose:#b8336a;
    --shadow:0 24px 60px -18px rgba(90,50,20,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",
                "Apple Color Emoji","Segoe UI Emoji",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 800px at 12% 8%, #fff6df 0%, rgba(255,246,223,0) 60%),
      radial-gradient(1000px 700px at 88% 92%, #ffe6ef 0%, rgba(255,230,239,0) 62%),
      radial-gradient(900px 700px at 80% 6%, #e6f1ff 0%, rgba(230,241,255,0) 60%),
      linear-gradient(160deg,#fff3dc 0%,#ffe9d2 45%,#ffe3e9 100%);
    display:grid;
    place-items:center;
    padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
    overflow:hidden;
    position:relative;
  }
  /* soft drifting glow blobs */
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;z-index:0;
  }
  body::before{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#ffd79a,transparent 70%);animation:drift 18s ease-in-out infinite}
  body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-14vmax;background:radial-gradient(circle,#ffc2d8,transparent 70%);animation:drift 22s ease-in-out infinite reverse}
  @keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(3vmax,2vmax,0)}}

  .stage{
    position:relative;z-index:2;
    width:min(92vw,420px);
    display:grid;place-items:center;
  }

  /* ── ENVELOPE ───────────────────────────────────────── */
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:1.55 / 1;
    cursor:pointer;
    border:0;padding:0;background:none;
    font:inherit;color:inherit;
    filter:drop-shadow(0 26px 40px rgba(120,70,30,.30));
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  .envelope:active{transform:scale(.975)}
  .envelope:focus-visible{outline:3px solid var(--gold);outline-offset:10px;border-radius:10px}

  .env-body{
    position:absolute;inset:0;
    border-radius:14px;
    background:
      linear-gradient(150deg,var(--env1) 0%,var(--env2) 58%,var(--env3) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      inset 0 -20px 40px -20px rgba(140,85,30,.35),
      var(--shadow);
    overflow:hidden;
  }
  /* bottom + side folds */
  .env-body::before{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(to top right, transparent calc(50% - 1px), rgba(255,255,255,.55) 50%, transparent calc(50% + 1px)) no-repeat,
      linear-gradient(to top left,  transparent calc(50% - 1px), rgba(255,255,255,.45) 50%, transparent calc(50% + 1px)) no-repeat;
    opacity:.9;
  }
  /* lower V fold shading */
  .env-body::after{
    content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:72%;
    background:linear-gradient(to top, rgba(160,100,40,.18), rgba(160,100,40,0));
    clip-path:polygon(0 100%,50% 6%,100% 100%);
  }

  /* the card that slides out */
  .letter{
    position:absolute;
    left:6%;right:6%;
    top:5%;
    height:80%;
    border-radius:12px;
    background:
      linear-gradient(180deg,var(--paper) 0%,var(--cream) 100%);
    box-shadow:0 6px 16px -8px rgba(80,45,15,.5), inset 0 0 0 1px rgba(201,150,47,.28);
    transform:translateY(26%) scale(.94);
    opacity:0;
    /* Must sit ABOVE .env-front (z-index 3) or the card slides out invisibly
       behind the envelope and the whole open animation is dead code. */
    z-index:6;
    transition:transform .95s cubic-bezier(.2,.9,.25,1) .25s, opacity .5s ease .25s;
    display:grid;place-items:center;
    overflow:hidden;
  }
  .letter .peek{
    font-size:clamp(11px,3vw,13px);letter-spacing:.34em;text-transform:uppercase;
    color:#b98b3c;font-weight:700;
  }

  .env-front{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    border-radius:14px;
    background:linear-gradient(to top, var(--env2) 0%, var(--env1) 100%);
    clip-path:polygon(0 0, 0 100%, 50% 58%, 100% 100%, 100% 0, 100% 0, 50% 0);
    /* front = lower V only, plus top edge covered by flap */
    clip-path:polygon(0 100%, 0 34%, 50% 78%, 100% 34%, 100% 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .env-front::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top, rgba(150,95,35,.22), rgba(150,95,35,0) 60%);
  }

  .flap{
    position:absolute;left:0;right:0;top:0;height:60%;
    z-index:4;
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform .75s cubic-bezier(.6,-0.15,.35,1.15), z-index 0s linear .45s;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .flap i{
    position:absolute;inset:0;
    background:linear-gradient(to bottom, var(--env1) 0%, var(--env2) 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-radius:14px 14px 0 0;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 6px 14px -8px rgba(120,70,30,.45);
  }
  /* wax seal */
  .seal{
    position:absolute;left:50%;top:calc(60% - 22px);transform:translate(-50%,0);
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #e0578d 0%, #b8336a 45%, #8e1f4c 100%);
    box-shadow:0 8px 18px -6px rgba(120,20,60,.55), inset 0 2px 3px rgba(255,255,255,.4);
    z-index:5;
    display:grid;place-items:center;
    transition:opacity .35s ease, transform .45s ease;
    color:#ffd9e7;font-size:22px;line-height:1;
  }
  .seal span{transform:translateY(-1px)}

  .hint{
    position:absolute;left:50%;bottom:-52px;transform:translateX(-50%);
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
    color:#a9713a;opacity:.85;white-space:nowrap;
    animation:pulse 2.4s ease-in-out infinite;
    transition:opacity .3s ease;
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}

  /* ── OPENED STATE ───────────────────────────────────── */
  /* Open: flap flips back and drops BELOW the letter (z-index 6) so the card
     isn't hidden behind it while it slides out. */
  .stage.open .flap{transform:rotateX(-176deg);z-index:0;transition:transform .75s cubic-bezier(.4,0,.3,1), z-index 0s linear .3s}
  .stage.open .seal{opacity:0;transform:translate(-50%,10px) scale(.6)}
  /* Letter rises out, then hands off: fade it once the card takes over so it
     doesn't ghost through the card's translucent background. */
  .stage.open .letter{
    transform:translateY(-58%) scale(1);
    opacity:1;
    z-index:6;
    box-shadow:0 30px 60px -24px rgba(90,50,20,.45), inset 0 0 0 1px rgba(201,150,47,.35);
    transition:transform .95s cubic-bezier(.2,.9,.25,1) .25s, opacity .45s ease 1.05s;
  }
  /* Handoff: card is fading in by now, so drop the letter out of the way. */
  .stage.open .letter.gone{opacity:0}
  .stage.open .envelope{cursor:default;filter:drop-shadow(0 30px 44px rgba(120,70,30,.22))}
  .stage.open .hint{opacity:0;animation:none}

  /* ── THE CARD ───────────────────────────────────────── */
  .card{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    pointer-events:none;opacity:0;
    transition:opacity .6s ease;
    perspective:1400px;
  }
  .card.show{opacity:1;pointer-events:auto}

  .card-inner{
    position:relative;
    width:min(94vw,560px);
    max-height:92svh;max-height:92vh;overflow:auto;
    border-radius:22px;
    padding:clamp(28px,6vw,52px) clamp(22px,5.5vw,46px);
    text-align:center;
    background:
      radial-gradient(700px 300px at 50% -10%, #fffdf6, rgba(255,253,246,0)),
      linear-gradient(170deg,#fffdf9 0%,#fff6e4 70%,#ffeef2 100%);
    box-shadow:
      0 40px 90px -30px rgba(90,45,15,.5),
      0 0 0 1px rgba(201,150,47,.35),
      inset 0 0 0 8px rgba(255,255,255,.6);
    transform:translateY(14px) scale(.95) rotateX(6deg);
    transition:transform .8s cubic-bezier(.2,.9,.25,1) .1s;
    -webkit-overflow-scrolling:touch;
  }
  .card.show .card-inner{transform:none}

  /* gold double border moat */
  .card-inner::before{
    content:"";position:absolute;inset:11px;border-radius:14px;
    border:1px solid rgba(201,150,47,.55);
    pointer-events:none;
  }
  /* corner stars */
  .card-inner::after{
    content:"✦";position:absolute;top:16px;left:50%;transform:translateX(-50%);
    color:var(--gold);font-size:15px;letter-spacing:.6em;text-indent:.6em;opacity:.85;
  }

  .kicker{
    margin:6px 0 18px;font-size:clamp(10px,2.6vw,12px);
    letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:#bd8a36;
  }

  .title{
    margin:0 0 6px;
    /* Two long venue names now, each on its own line — cap smaller than the
       single-name version so "Жёлтая Мельница" doesn't wrap. */
    font-size:clamp(26px,7.6vw,42px);
    line-height:1.12;
    font-weight:800;
    letter-spacing:-.015em;
    background:linear-gradient(100deg,#8e1f4c 0%,#c9962f 42%,#b8336a 78%,#5b2a86 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-wrap:balance;
  }
  .title-underline{
    width:min(58%,230px);height:2px;margin:16px auto 22px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold) 20%,#e0578d 50%,var(--gold) 80%,transparent);
    opacity:.9;
  }
  /* The two venues are long Russian names, so the "&" sits on its own line:
     smaller than the names, gold, no gradient so it reads as a separator.
     line-height in px, not a unitless ratio: a unitless value is inherited
     against the PARENT's font-size (1.12 x 42px = 47px line box), which is what
     left a big gap above and below the small "&". */
  .amp{
    display:block;
    font-size:.42em;
    line-height:18px;
    margin:0;
    -webkit-text-fill-color:var(--gold);
    color:var(--gold);
    opacity:.85;
  }

  .ru{
    margin:0 0 8px;font-size:clamp(15px,4.2vw,21px);line-height:1.4;font-weight:700;
    color:#4a3559;
    text-wrap:balance;
  }
  .sub{
    margin:18px auto 0;max-width:34ch;
    font-size:clamp(13px,3.6vw,16px);line-height:1.65;color:#6a5b74;
  }
  .sub b{color:#b8336a;font-weight:700}

  .badges{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 4px;
  }
  .badge{
    font-size:clamp(10.5px,2.9vw,12.5px);font-weight:700;letter-spacing:.06em;
    padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.85);
    border:1px solid rgba(201,150,47,.45);
    color:#8a6a2e;
    box-shadow:0 3px 10px -6px rgba(120,70,30,.5);
  }

  /* Suggested button + the image it loads */
  .suggested{
    display:inline-flex;align-items:center;gap:7px;
    margin:22px auto 0;
    font:inherit;font-size:clamp(11px,3vw,13px);font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;
    padding:11px 22px;border-radius:999px;cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#b8336a 0%,#8e1f4c 100%);
    border:0;
    box-shadow:0 8px 20px -8px rgba(140,30,80,.65);
    transition:transform .25s cubic-bezier(.2,.9,.25,1), box-shadow .25s ease;
    -webkit-appearance:none;appearance:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .suggested:hover{box-shadow:0 12px 26px -8px rgba(140,30,80,.75)}
  .suggested:active{transform:scale(.96)}
  .suggested:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

  /* Full-screen image viewer */
  .shot{
    position:fixed;inset:0;z-index:50;
    display:grid;place-items:center;
    padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
    background:rgba(30,15,25,.86);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;
    transition:opacity .4s ease;
  }
  .shot.show{opacity:1;pointer-events:auto}
  .shot img{
    max-width:100%;max-height:88svh;max-height:88vh;
    width:auto;height:auto;
    border-radius:16px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
    transform:scale(.94);
    transition:transform .4s cubic-bezier(.2,.9,.25,1);
  }
  .shot.show img{transform:none}
  .shot-close{
    position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.92);color:#8e1f4c;
    font-size:22px;line-height:1;font-weight:700;
    display:grid;place-items:center;
    box-shadow:0 6px 18px -6px rgba(0,0,0,.5);
    -webkit-appearance:none;appearance:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── CONFETTI ───────────────────────────────────────── */
  .confetti{
    position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;
  }
  .confetti i{
    position:absolute;top:-8vh;display:block;border-radius:2px;
    will-change:transform;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}
    6%{opacity:1}
    100%{transform:translate3d(var(--dx,0px), 116vh, 0) rotate(var(--rot,540deg));opacity:.95}
  }

  /* sparkles in card */
  .spark{
    position:absolute;color:var(--gold);pointer-events:none;
    animation:tw 2.6s ease-in-out infinite;
  }
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.95;transform:scale(1.1)}}

  .replay{
    position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:40;border:1px solid rgba(201,150,47,.5);background:rgba(255,255,255,.8);
    color:#8a6a2e;font:inherit;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 18px;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .4s ease;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    -webkit-appearance:none;appearance:none;
  }
  .card.show ~ .replay{opacity:1;pointer-events:auto}

  @media (max-height:520px){
    .stage{width:min(70vw,340px)}
    .card-inner{padding:22px 20px}
    .sub{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
    body::before,body::after{animation:none}
    .hint{animation:none;opacity:.85}
    .flap{transition:none}
    .stage.open .flap{transform:rotateX(-176deg)}
    .stage.open .letter{transform:translateY(-58%) scale(1);opacity:1}
    .stage.open .letter.gone{opacity:0}
    .card-inner{transform:none}
    .confetti{display:none}
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="envelope" id="env" role="button" tabindex="0" aria-label="Open your surprise">
    <div class="letter" aria-hidden="true"><span class="peek">For you</span></div>
    <div class="env-body" aria-hidden="true"></div>
    <div class="env-front" aria-hidden="true"></div>
    <div class="flap" aria-hidden="true"><i></i></div>
    <div class="seal" aria-hidden="true"><span>✦</span></div>
    <div class="hint">Tap to open</div>
  </div>
</main>

<div class="card" id="card" role="dialog" aria-modal="true" aria-label="Your gift" aria-hidden="true">
  <div class="card-inner">
    <span class="spark" style="top:8%;left:9%;font-size:14px;animation-delay:.1s">✦</span>
    <span class="spark" style="top:18%;right:8%;font-size:11px;animation-delay:.7s">✦</span>
    <span class="spark" style="bottom:12%;left:12%;font-size:12px;animation-delay:1.2s">✦</span>
    <span class="spark" style="bottom:22%;right:11%;font-size:15px;animation-delay:.4s">✦</span>

    <p class="kicker">С днём рождения! ✦</p>

    <h1 class="title">Disneyland Paris<span class="amp">&amp;</span>Жёлтая Мельница</h1>
    <div class="title-underline"></div>

    <p class="ru">С днём рождения! Ты у меня самая замечательная🫶</p>

    <p class="sub">Twenty-two years of you. <b>Happy birthday</b> — here's to the castle, the fireworks, and the yellow mill.</p>

    <div class="badges">
      <span class="badge">22 years</span>
      <span class="badge">Happy birthday</span>
      <span class="badge">Have the best time ✦</span>
    </div>

    <button class="suggested" id="suggested" type="button">
      <span>✦</span> Suggested
    </button>
  </div>
</div>

<!-- Loads the suggested-dates image on tap -->
<div class="shot" id="shot" role="dialog" aria-modal="true" aria-label="Suggested dates" aria-hidden="true">
  <button class="shot-close" id="shotClose" type="button" aria-label="Close">×</button>
  <img id="shotImg" src="suggested.jpg" alt="Suggested dates" draggable="false">
</div>

<button class="replay" id="replay" type="button">Close it back</button>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  var env    = document.getElementById('env');
  var stage  = document.getElementById('stage');
  var card   = document.getElementById('card');
  var conf   = document.getElementById('confetti');
  var replay = document.getElementById('replay');
  var suggested  = document.getElementById('suggested');
  var shot       = document.getElementById('shot');
  var shotClose  = document.getElementById('shotClose');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var opened = false;

  function burst() {
    if (reduce) return;
    var colors = ['#c9962f','#b8336a','#5b2a86','#e0578d','#f0b429','#3ba99c','#ffffff','#f7e2c4'];
    var n = window.innerWidth < 520 ? 70 : 120;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      var w = 5 + Math.random() * 7;
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.width = w + 'px';
      s.style.height = (w * (0.4 + Math.random() * 1.2)) + 'px';
      s.style.background = colors[(Math.random() * colors.length) | 0];
      s.style.setProperty('--dx', ((Math.random() - 0.5) * 220).toFixed(0) + 'px');
      s.style.setProperty('--rot', (360 + Math.random() * 900).toFixed(0) + 'deg');
      s.style.opacity = (0.75 + Math.random() * 0.25).toFixed(2);
      if (Math.random() > 0.7) s.style.borderRadius = '50%';
      s.style.animationDuration = (3.1 + Math.random() * 2.6).toFixed(2) + 's';
      s.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
      frag.appendChild(s);
    }
    conf.appendChild(frag);
    setTimeout(function () { conf.innerHTML = ''; }, 8000);
  }

  function open() {
    if (opened) return;
    opened = true;
    var letter = document.querySelector('.letter');
    stage.classList.add('open');
    card.setAttribute('aria-hidden', 'false');
    // Sequencing: flap flips (.75s) -> letter rises (.95s, starting .25s so it
    // lands ~1.2s) -> card fades in -> letter fades out so it can't ghost
    // through the card's translucent background.
    setTimeout(function () { card.classList.add('show'); }, reduce ? 0 : 1150);
    setTimeout(function () { letter.classList.add('gone'); }, reduce ? 0 : 1450);
    setTimeout(burst, reduce ? 0 : 1250);
  }

  function reset() {
    opened = false;
    card.classList.remove('show');
    card.setAttribute('aria-hidden', 'true');
    conf.innerHTML = '';
    // Clear the handoff class too, or replaying shows an envelope with no letter.
    document.querySelector('.letter').classList.remove('gone');
    shot.classList.remove('show');
    shot.setAttribute('aria-hidden', 'true');
    setTimeout(function () { stage.classList.remove('open'); }, 250);
  }

  // iPhone Safari + desktop: pointer/touch/click all covered, guarded by `opened`.
  ['pointerdown', 'touchstart', 'click'].forEach(function (e) {
    env.addEventListener(e, function (ev) { ev.preventDefault(); open(); }, { passive: false });
  });
  env.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
  });
  replay.addEventListener('click', reset);

  // Suggested: tap to load the image full-screen. Stop propagation so the tap
  // can't fall through to the envelope/card handlers underneath.
  function showShot(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    shot.classList.add('show');
    shot.setAttribute('aria-hidden', 'false');
  }
  function hideShot(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    shot.classList.remove('show');
    shot.setAttribute('aria-hidden', 'true');
  }
  ['pointerdown', 'touchstart', 'click'].forEach(function (e) {
    suggested.addEventListener(e, showShot, { passive: false });
    shotClose.addEventListener(e, hideShot, { passive: false });
  });
  // Tap the backdrop (not the image) to dismiss.
  shot.addEventListener('click', function (ev) {
    if (ev.target === shot) hideShot(ev);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && shot.classList.contains('show')) hideShot(ev);
  });
})();
</script>
</body>
</html>
